# Auto-deploy trigger for frappe_chatwoot app
# When code is pushed to main, triggers a rolling deploy in Devops-Scripts.
#
# Required secret: DEPLOY_DISPATCH_TOKEN (GitHub PAT with repo scope
# on CarrumMobility/Devops-Scripts to trigger repository_dispatch)
name: Trigger ERPNext v3 Deploy

on:
  push:
    branches: [main]

jobs:
  trigger-deploy:
    name: Trigger rolling deploy (dev)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: CarrumMobility/Devops-Scripts
          event-type: deploy-erpnext-v3
          client-payload: '{"app": "frappe_chatwoot", "environment": "dev"}'
